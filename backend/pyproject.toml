[project]
name = "expense-tracker-backend"
version = "0.1.0"
description = "FastAPI + MongoDB backend for the Expense Tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo>=4.14",
    "beanie>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "isort>=5.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency-injection pattern (Depends()/File()/Query() as a
# parameter default) is intentional and idiomatic, not the mutable-default
# footgun this rule targets elsewhere.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Both fixtures AND test functions must share one event loop: the session-scoped
# mongo_client fixture creates an AsyncMongoClient bound to whichever loop is
# running when it's set up, and pymongo's async client refuses to be used from
# a different loop later. Function-scoped (the default) would give each test
# its own loop and break on the very first DB-touching test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
