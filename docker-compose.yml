services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017" # optional: lets you connect a local GUI (Compass, mongosh) to inspect data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: expense_tracker
      CORS_ORIGINS: '["http://localhost:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        # Reachable from the host browser, not from inside the Docker
        # network -- see docker/frontend.Dockerfile's comment on why.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
