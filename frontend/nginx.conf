# Serves the built SPA (frontend/dist, copied here by docker/frontend.Dockerfile).
# Not used in local dev -- `npm run dev` uses Vite's own dev server instead.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path nginx doesn't have a file for (e.g. a
    # deep-linked or refreshed route) still serves index.html, letting the
    # client-side app take over instead of nginx returning its own 404.
    # Not exercised yet (this app has no client-side routes to deep-link
    # into), but it's the standard, harmless default for a single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built asset filenames (a content hash in the name),
    # so a new deploy naturally gets new URLs -- these files never need to
    # be revalidated, only ever replaced outright.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
